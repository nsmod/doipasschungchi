name: SONCHOIGAME
options:
  bundleIdPrefix: com.sonchoigame
  deploymentTarget:
    iOS: "16.0"
packages:
  OpenSSL:
    url: https://github.com/21-DOT-DEV/swift-openssl.git
    exactVersion: 0.1.0
targets:
  SONCHOIGAME:
    type: application
    platform: iOS
    sources:
      - SONCHOIGAME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonchoigame.p12tool
        SWIFT_OBJC_BRIDGING_HEADER: SONCHOIGAME/Bridge/SONCHOIGAME-Bridging-Header.h
        INFOPLIST_KEY_CFBundleDisplayName: SONCHOIGAME
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: OpenSSL
        product: libcrypto
